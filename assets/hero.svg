<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Lokesh Prabu J — AI/ML Engineer, Full-Stack Developer, Cloud Practitioner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0716"/>
      <stop offset="55%" stop-color="#140d2b"/>
      <stop offset="100%" stop-color="#0b0716"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="aurora1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#a78bfa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect width="1000" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- drifting aurora -->
    <circle r="230" fill="url(#aurora1)">
      <animate attributeName="cx" values="170;420;170" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;150;70"  dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="200" fill="url(#aurora2)">
      <animate attributeName="cx" values="830;600;830" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;90;210"  dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- drifting particles -->
    <g fill="#c4b5fd">
      <circle cx="120" cy="60" r="1.6" opacity="0.7">
        <animate attributeName="cy" values="60;40;60" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="90" r="1.4" opacity="0.6">
        <animate attributeName="cy" values="90;66;90" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="230" r="1.5" opacity="0.5">
        <animate attributeName="cy" values="230;208;230" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="240" r="1.3" opacity="0.55">
        <animate attributeName="cy" values="240;220;240" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- corner brackets -->
    <g stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.55">
      <path d="M28 62 L28 34 L56 34"/>
      <path d="M972 62 L972 34 L944 34"/>
      <path d="M28 218 L28 246 L56 246"/>
      <path d="M972 218 L972 246 L944 246"/>
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="4.5s" repeatCount="indefinite"/>
    </g>

    <!-- eyebrow -->
    <text x="500" y="86" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="13" letter-spacing="6" fill="#a78bfa" opacity="0">
      CHENNAI &#183; INDIA
      <animate attributeName="opacity" values="0;0.9;0.9" dur="1.6s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="500" y="152" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif"
          font-size="60" font-weight="800" letter-spacing="3" fill="url(#nameFill)" opacity="0">
      LOKESH PRABU J
      <animate attributeName="opacity" values="0;1" dur="1.1s" begin="0.35s" fill="freeze"/>
      <animate attributeName="font-size" values="52;60" dur="1.1s" begin="0.35s" fill="freeze"/>
    </text>

    <!-- animated rule -->
    <line x1="330" y1="176" x2="670" y2="176" stroke="url(#sweep)" stroke-width="2.5"/>
    <line x1="330" y1="176" x2="670" y2="176" stroke="#7c3aed" stroke-width="1" opacity="0.25"/>

    <!-- role -->
    <text x="500" y="210" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="15.5" letter-spacing="2.2" fill="#cbd5e1" opacity="0">
      AI/ML Engineer &#183; Full-Stack Developer &#183; Cloud Practitioner
      <animate attributeName="opacity" values="0;0.95" dur="1.2s" begin="0.9s" fill="freeze"/>
    </text>

    <!-- status pill -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.4s" fill="freeze"/>
      <rect x="396" y="230" width="208" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/>
      <circle cx="416" cy="243" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="430" y="248" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5"
            letter-spacing="1.4" fill="#86efac">OPEN TO OPPORTUNITIES</text>
    </g>
  </g>
</svg>
