    <clipPath id="c4"><rect x="34" y="0" height="372" width="0"><animate attributeName="width" from="0" to="470" dur="0.8s" begin="2.3s"  fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="34" y="0" height="372" width="0"><animate attributeName="width" from="0" to="470" dur="0.8s" begin="2.9s"  fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="34" y="0" height="372" width="0"><animate attributeName="width" from="0" to="470" dur="0.8s" begin="3.5s"  fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="34" y="0" height="372" width="0"><animate attributeName="width" from="0" to="470" dur="0.8s" begin="4.1s"  fill="freeze"/></rect></clipPath>
    <clipPath id="c8"><rect x="34" y="0" height="372" width="0"><animate attributeName="width" from="0" to="220" dur="0.5s" begin="5.0s"  fill="freeze"/></rect></clipPath>
