    <g clip-path="url(#c5)"><text x="34" y="188"><tspan class="k">research</tspan><tspan class="d" dx="8">:</tspan><tspan class="v" dx="8">HCT-CBAM</tspan><tspan class="d" dx="8">→ 81.4% Top-1 · Food-101</tspan></text></g>
    <g clip-path="url(#c6)"><text x="34" y="212"><tspan class="k">shipping</tspan><tspan class="d" dx="8">:</tspan><tspan class="v" dx="8">REST APIs · AWS · CI/CD</tspan><tspan class="d" dx="8">@ Infosys</tspan></text></g>
    <g clip-path="url(#c7)"><text x="34" y="236"><tspan class="k">learning</tspan><tspan class="d" dx="8">:</tspan><tspan class="v" dx="8">RAG at scale · Kubernetes · LLM eval</tspan></text></g>

